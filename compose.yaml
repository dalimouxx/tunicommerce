x-application-environment: &application-environment
  NODE_ENV: production
  DATABASE_URL: postgresql://tunicom_app:${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD required}@db:5432/tunicom
  APP_URL: https://${PLATFORM_DOMAIN:?PLATFORM_DOMAIN required}
  APP_ENCRYPTION_SECRET: ${APP_ENCRYPTION_SECRET:?APP_ENCRYPTION_SECRET required}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  MAIL_FROM: ${MAIL_FROM:-}
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}
  STOREFRONT_DOMAIN_ROUTING: ${STOREFRONT_DOMAIN_ROUTING:-disabled}
  STOREFRONT_ROOT_DOMAIN: ${STOREFRONT_ROOT_DOMAIN:-}
  DOMAIN_DNS_SERVERS: ${DOMAIN_DNS_SERVERS:-}

x-runtime: &runtime
  build:
    context: .
    target: runtime
  image: tunicom-runtime:${TUNICOM_IMAGE_TAG:-local}
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 128
  tmpfs:
    - /tmp:size=128m,mode=1777
    - /app/.next/cache:size=64m,uid=1000,gid=1000,mode=0700
  networks: [backend, front]
  depends_on:
    migrate:
      condition: service_completed_successfully
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: tunicom
      POSTGRES_USER: tunicom_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./deploy/vps/init-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    networks: [backend]
    shm_size: 128m
    mem_limit: 768m
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U tunicom_admin -d tunicom']
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  migrate:
    build:
      context: .
      target: migrator
    image: tunicom-migrator:${TUNICOM_IMAGE_TAG:-local}
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://tunicom_admin:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@db:5432/tunicom
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    read_only: true
    tmpfs: ['/tmp:size=128m,mode=1777']
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m

  web:
    <<: *runtime
    environment:
      <<: *application-environment
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      MEDIA_STORAGE_MODE: ${MEDIA_STORAGE_MODE:-database}
      MEDIA_STORAGE_ROOT: /srv/tunicom-media
      MEDIA_GC_ENABLED: ${MEDIA_GC_ENABLED:-false}
    volumes:
      - media-data:/srv/tunicom-media
    mem_limit: 768m
    stop_grace_period: 40s
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health',{signal:AbortSignal.timeout(4000)}).then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 12

  worker:
    <<: *runtime
    command: [node, --import, tsx, scripts/worker.ts]
    environment: *application-environment
    mem_limit: 384m
    stop_grace_period: 100s
    healthcheck:
      test: [CMD, node, --import, tsx, scripts/worker-health.ts]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 4

  edge:
    image: caddy:2-alpine
    profiles: [edge]
    restart: unless-stopped
    environment:
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:?PLATFORM_DOMAIN required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL required}
      STOREFRONT_DOMAIN_ROUTING: ${STOREFRONT_DOMAIN_ROUTING:-disabled}
    ports: ['80:80', '443:443']
    volumes:
      - ./deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/vps/logging.caddy:/etc/caddy/logging.caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [front]
    depends_on:
      web:
        condition: service_healthy
    read_only: true
    tmpfs: [/tmp:size=32m]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  backend:
    internal: true
  front: {}

volumes:
  postgres-data: {}
  media-data: {}
  caddy-data: {}
  caddy-config: {}
