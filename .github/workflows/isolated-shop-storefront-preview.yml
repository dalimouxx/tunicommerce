name: TuniCommerce isolated shop storefront preview
on:
  pull_request:
    paths:
      - 'modules/shops/storefront-preview.ts'
      - 'app/mes-boutiques/[shopId]/apercu/page.tsx'
      - 'app/mes-boutiques/[shopId]/page.tsx'
      - 'app/mes-boutiques/page.tsx'
      - 'tests/isolated-shop-storefront-preview.test.ts'
      - '.github/workflows/isolated-shop-storefront-preview.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/isolated-shop-storefront-preview.test.ts
      - run: npm run typecheck
      - run: npm run build
