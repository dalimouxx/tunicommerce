name: TuniCommerce merchant shop directory quotas
on:
  pull_request:
    paths:
      - 'app/mes-boutiques/page.tsx'
      - '.github/workflows/merchant-shop-directory-quotas.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run build
