name: Tunicom VPS container lifecycle and restore
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/vps-container-test.mjs
