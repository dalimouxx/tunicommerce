name: TuniCommerce isolated merchant customer request decisions
on:
  pull_request:
    paths:
      - 'modules/shops/orders.ts'
      - 'modules/shops/customer-request-queue.ts'
      - 'tests/merchant-customer-request-queue.test.ts'
      - 'modules/shops/order-fulfillment.ts'
      - 'modules/shops/public-tracking-progress.ts'
      - 'tests/public-tracking-progress.test.ts'
      - 'app/mes-boutiques/[shopId]/shop-customer-requests.tsx'
      - 'app/mes-boutiques/[shopId]/merchant-shop-workspace.tsx'
      - 'app/vitrines/[slug]/suivi/[token]/page.tsx'
      - 'tests/isolated-customer-request-resolution.test.ts'
      - 'tests/priority1-http-tenant-boundary.test.ts'
      - '.github/workflows/p23-merchant-customer-requests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-customer-decisions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/isolated-customer-request-resolution.test.ts tests/isolated-public-customer-request.test.ts tests/merchant-customer-request-queue.test.ts tests/public-tracking-progress.test.ts
      - run: npm run typecheck
      - run: npm run build
