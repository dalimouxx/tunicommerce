name: TuniCommerce merchant exception center
on:
  pull_request:
    paths:
      - 'modules/shops/merchant-exceptions.ts'
      - 'app/mes-boutiques/[shopId]/anomalies/page.tsx'
      - 'app/mes-boutiques/[shopId]/page.tsx'
      - 'tests/isolated-merchant-exceptions.test.ts'
      - '.github/workflows/merchant-exception-center.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/isolated-merchant-exceptions.test.ts
      - run: npm run typecheck
      - run: npm run build
