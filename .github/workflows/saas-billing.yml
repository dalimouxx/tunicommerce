name: TuniCommerce SaaS payment declarations
on:
  push:
    branches: ['feat/offline-saas-billing-2026-11']
  pull_request:
    paths:
      - 'app/admin/paiements/**'
      - 'app/admin/layout.tsx'
      - 'app/admin/page.tsx'
      - 'app/admin/abonnements/**'
      - 'app/admin/platform.module.css'
      - 'app/api/admin/subscription-payments/**'
      - 'app/api/v1/subscription-payments/**'
      - 'app/mon-abonnement/**'
      - 'modules/billing/**'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/202611020002_subscription_payments/**'
      - 'tests/saas-billing-api.test.ts'
      - '.github/workflows/saas-billing.yml'
permissions:
  contents: read
jobs:
  manual-payments:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tunicommerce_billing_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tunicommerce_billing_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tunicommerce_billing_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run build
      - run: node --import tsx --test tests/saas-billing-api.test.ts
