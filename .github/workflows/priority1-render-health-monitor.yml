name: TuniCommerce P1 Render and Neon smoke monitoring
on:
  pull_request:
    paths:
      - 'scripts/priority1-live-health.mjs'
      - 'tests/priority1-live-health.test.mjs'
      - 'docs/priority1-monitoring.md'
      - '.github/workflows/priority1-render-health-monitor.yml'
  schedule:
    - cron: '17 7,19 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/priority1-live-health.test.mjs
  live-health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Render web service and underlying Neon database response
        run: node scripts/priority1-live-health.mjs
