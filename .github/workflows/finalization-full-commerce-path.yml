name: TuniCommerce full commercial path regression
on:
  pull_request:
    paths:
      - 'tests/finalization-full-commerce-path.test.ts'
      - 'docs/preparation-lancement-tunicommerce.md'
      - '.github/workflows/finalization-full-commerce-path.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/finalization-full-commerce-path.test.ts
      - run: npm run typecheck
      - run: npm run build
