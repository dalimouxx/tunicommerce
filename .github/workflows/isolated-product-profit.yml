name: TuniCommerce merchant product profitability
on:
  pull_request:
    paths:
      - 'modules/shops/product-profit-analytics.ts'
      - 'app/mes-boutiques/[shopId]/analyse-produits/page.tsx'
      - 'app/mes-boutiques/[shopId]/page.tsx'
      - 'tests/isolated-product-profit-analytics.test.ts'
      - '.github/workflows/isolated-product-profit.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/isolated-product-profit-analytics.test.ts
      - run: npm run typecheck
      - run: npm run build
