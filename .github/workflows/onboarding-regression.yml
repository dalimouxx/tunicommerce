name: TuniCommerce merchant onboarding
on:
  push:
    branches: ['audit/**']
  pull_request:
    paths:
      - 'app/api/auth/register/**'
      - 'app/api/v1/onboarding/**'
      - 'app/inscription/**'
      - 'app/demarrage/**'
      - 'modules/onboarding/**'
      - 'components/auth-form.tsx'
      - 'components/commerce-app.tsx'
      - 'tests/onboarding-*.test.ts'
      - '.github/workflows/onboarding-regression.yml'
permissions:
  contents: read
jobs:
  onboarding:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tunicommerce_onboarding_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tunicommerce_onboarding_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tunicommerce_onboarding_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: node --import tsx --test tests/onboarding-validation.test.ts
      - run: npm run db:migrate
      - run: npm run build
      - run: node --import tsx --test tests/onboarding-api.test.ts
