name: TuniCommerce call-center contact history
on:
  pull_request:
    paths:
      - 'modules/shops/contact-history.ts'
      - 'app/mes-boutiques/[shopId]/shop-confirmation-desk.tsx'
      - 'tests/isolated-call-center-contact-history.test.ts'
      - '.github/workflows/isolated-call-center-contact-history.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/isolated-call-center-contact-history.test.ts
      - run: npm run typecheck
      - run: npm run build
