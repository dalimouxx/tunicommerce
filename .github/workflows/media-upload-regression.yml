name: TuniCommerce secure image uploads
on:
  push:
    branches: ['audit/**']
  pull_request:
    paths:
      - 'app/api/media/**'
      - 'app/api/v1/media/**'
      - 'app/personnalisation/**'
      - 'modules/media/**'
      - 'modules/appearance/**'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/202611010003_shop_media/**'
      - 'tests/media-*.test.ts'
      - '.github/workflows/media-upload-regression.yml'
permissions:
  contents: read
jobs:
  uploads:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tunicommerce_media_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tunicommerce_media_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tunicommerce_media_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: node --import tsx --test tests/media-validation.test.ts
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run build
      - run: node --import tsx --test tests/media-api.test.ts
