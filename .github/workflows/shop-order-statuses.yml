name: TuniCommerce shop order status overview
on:
  pull_request:
    paths:
      - 'modules/shops/commercial-overview.ts'
      - 'app/mes-boutiques/[shopId]/page.tsx'
      - 'tests/shop-order-statuses.test.ts'
      - '.github/workflows/shop-order-statuses.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/shop-order-statuses.test.ts
      - run: npm run typecheck
      - run: npm run build
