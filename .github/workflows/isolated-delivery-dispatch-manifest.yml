name: TuniCommerce delivery dispatch manifest
on:
  pull_request:
    paths:
      - 'modules/shops/dispatch-manifest.ts'
      - 'app/api/v1/shops/[shopId]/dispatch-manifest/route.ts'
      - 'app/mes-boutiques/[shopId]/shop-fulfillment.tsx'
      - 'tests/isolated-dispatch-manifest.test.ts'
      - '.github/workflows/isolated-delivery-dispatch-manifest.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/isolated-dispatch-manifest.test.ts
      - run: npm run typecheck
      - run: npm run build
