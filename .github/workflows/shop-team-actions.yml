name: TuniCommerce shop team write actions
on:
  pull_request:
    paths:
      - 'modules/shops/aggregate-quotas.ts'
      - 'modules/shops/team-actions.ts'
      - 'app/api/v1/shops/**/team-actions/**'
      - 'tests/shop-team-actions.test.ts'
      - 'tests/portals.test.ts'
      - '.github/workflows/shop-team-actions.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/shop-team-actions.test.ts
      - run: npm run typecheck
      - run: npm run build
