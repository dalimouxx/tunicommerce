name: TuniCommerce tenant regression
on:
  push:
    branches: ['audit/**']
  pull_request:
    paths:
      - 'app/api/v1/organizations/**'
      - 'app/api/v1/shops/**'
      - 'modules/shops/**'
      - 'prisma/**'
      - 'tests/tenancy-*.test.ts'
      - '.github/workflows/tenant-regression.yml'
permissions:
  contents: read
jobs:
  tenancy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tunicommerce_tenancy_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tunicommerce_tenancy_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tunicommerce_tenancy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: node --import tsx --test tests/tenancy-validation.test.ts
      - run: npm run db:migrate
      - run: npm run build
      - run: node --import tsx --test tests/tenancy-api.test.ts
