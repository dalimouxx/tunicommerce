name: TuniCommerce Merchant Shop Directory
on:
  pull_request:
    paths:
      - 'app/mes-boutiques/**'
      - 'modules/shops/navigation.ts'
      - 'tests/shop-navigation.test.ts'
      - '.github/workflows/merchant-shop-directory.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/shop-navigation.test.ts
      - run: npm run typecheck
      - run: npm run build
