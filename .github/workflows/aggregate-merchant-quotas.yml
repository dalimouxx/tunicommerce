name: TuniCommerce aggregated merchant quotas
on:
  pull_request:
    paths:
      - 'modules/shops/aggregate-quotas.ts'
      - 'modules/shops/inventory.ts'
      - 'modules/shops/orders.ts'
      - 'tests/aggregate-merchant-quotas.test.ts'
      - 'tests/portals.test.ts'
      - '.github/workflows/aggregate-merchant-quotas.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/aggregate-merchant-quotas.test.ts
      - run: npm run typecheck
      - run: npm run build
