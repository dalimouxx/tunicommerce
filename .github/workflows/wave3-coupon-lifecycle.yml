name: TuniCommerce coupon lifecycle
on:
  pull_request:
    paths:
      - 'modules/commerce/service.ts'
      - 'modules/shops/merchant-coupons.ts'
      - 'app/api/v1/shops/[shopId]/coupons/route.ts'
      - 'app/mes-boutiques/[shopId]/shop-coupons.tsx'
      - 'tests/isolated-coupon-lifecycle.test.ts'
      - '.github/workflows/wave3-coupon-lifecycle.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/isolated-coupon-lifecycle.test.ts tests/isolated-public-coupons.test.ts
      - run: npm run typecheck
      - run: npm run build
