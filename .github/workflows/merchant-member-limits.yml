name: TuniCommerce merchant member limits
on:
  pull_request:
    paths:
      - 'modules/shops/member-limits.ts'
      - 'modules/shops/team.ts'
      - 'tests/merchant-member-limits.test.ts'
      - 'tests/team-api.test.ts'
      - '.github/workflows/merchant-member-limits.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/merchant-member-limits.test.ts
      - run: npm run typecheck
      - run: npm run build
