name: TuniCommerce product photo library
on:
  push:
    branches: ['audit/**']
  pull_request:
    paths:
      - 'app/api/v1/product-media/**'
      - 'app/api/media/products/**'
      - 'app/mediatheque/**'
      - 'components/product-media-library*'
      - 'modules/product-media/**'
      - 'modules/platform/media.ts'
      - 'modules/commerce/service.ts'
      - 'app/api/commerce/route.ts'
      - 'components/forms.tsx'
      - 'components/commerce-app.tsx'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/202611010004_product_media/**'
      - 'tests/product-media-*.test.ts'
      - '.github/workflows/product-media-regression.yml'
permissions:
  contents: read
jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tunicommerce_product_library_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tunicommerce_product_library_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tunicommerce_product_library_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: node --import tsx --test tests/product-media-validation.test.ts
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run build
      - run: node --import tsx --test tests/product-media-api.test.ts
