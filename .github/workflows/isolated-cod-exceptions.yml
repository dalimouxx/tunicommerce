name: TuniCommerce COD exception export
on:
  pull_request:
    paths:
      - 'modules/shops/cod-exceptions.ts'
      - 'app/api/v1/shops/[shopId]/cod-exceptions/route.ts'
      - 'app/mes-boutiques/[shopId]/shop-cod-matching.tsx'
      - 'tests/isolated-cod-exceptions.test.ts'
      - '.github/workflows/isolated-cod-exceptions.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/isolated-cod-exceptions.test.ts
      - run: npm run typecheck
      - run: npm run build
