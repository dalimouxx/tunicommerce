name: TuniCommerce P1 private integrity dashboard
on:
  pull_request:
    paths:
      - 'modules/platform/commerce-integrity.ts'
      - 'app/admin/fiabilite/page.tsx'
      - 'app/admin/layout.tsx'
      - 'tests/priority1-commerce-integrity.test.ts'
      - '.github/workflows/priority1-commerce-integrity.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/priority1-commerce-integrity.test.ts
      - run: npm run typecheck
      - run: npm run build
