name: TuniCommerce official SaaS payment reception
on:
  push:
    branches: ['feat/saas-payment-reception-2026-11']
  pull_request:
    paths:
      - 'app/admin/coordonnees-paiement/**'
      - 'app/admin/layout.tsx'
      - 'app/admin/paiements/page.tsx'
      - 'app/admin/platform.module.css'
      - 'app/api/admin/payment-reception/**'
      - 'app/api/v1/subscription-payments/**'
      - 'app/mon-abonnement/**'
      - 'modules/billing/reception.ts'
      - 'modules/billing/service.ts'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/202611020003_payment_reception/**'
      - 'tests/payment-reception-api.test.ts'
      - 'tests/saas-billing-api.test.ts'
      - '.github/workflows/payment-reception.yml'
permissions:
  contents: read
jobs:
  official-payment-coordinates:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tunicommerce_reception_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tunicommerce_reception_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tunicommerce_reception_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run build
      - run: node --import tsx --test tests/payment-reception-api.test.ts
      - run: node --import tsx --test tests/saas-billing-api.test.ts
