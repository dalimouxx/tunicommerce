name: TuniCommerce SaaS plan engine
on:
  push:
    branches: ['feat/saas-plan-engine-2026-11']
  pull_request:
    paths:
      - 'app/admin/plans/**'
      - 'app/admin/boutiques/**'
      - 'app/admin/gestion-boutiques/**'
      - 'app/admin/layout.tsx'
      - 'app/admin/abonnements/**'
      - 'app/api/admin/**'
      - 'app/api/commerce/**'
      - 'app/api/boutiques/**'
      - 'components/plan-override-editor.tsx'
      - 'components/admin-panel.tsx'
      - 'modules/subscriptions/**'
      - 'modules/product-media/service.ts'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/202611020001_saas_plans/**'
      - 'tests/saas-plan-api.test.ts'
      - '.github/workflows/saas-plan-engine.yml'
permissions:
  contents: read
jobs:
  saas-plan-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tunicommerce_saas_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tunicommerce_saas_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tunicommerce_saas_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run build
      - run: node --import tsx --test tests/saas-plan-api.test.ts
