name: TuniCommerce multi-module shop operations
on:
  pull_request:
    paths:
      - 'modules/shops/carrier-cod-report.ts'
      - 'app/mes-boutiques/[shopId]/page.tsx'
      - 'app/mes-boutiques/[shopId]/shop-confirmation-desk.tsx'
      - 'app/mes-boutiques/[shopId]/shop-inventory.tsx'
      - 'tests/isolated-shop-carrier-cod-report.test.ts'
      - '.github/workflows/isolated-shop-carrier-cod-report.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/isolated-shop-carrier-cod-report.test.ts
      - run: npm run typecheck
      - run: npm run build
