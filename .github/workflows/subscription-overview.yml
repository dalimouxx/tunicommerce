name: TuniCommerce subscription overview
on:
  pull_request:
    paths:
      - 'modules/subscriptions/overview.ts'
      - 'app/api/v1/subscription/overview/route.ts'
      - 'app/mon-abonnement/page.tsx'
      - 'tests/subscription-overview.test.ts'
      - '.github/workflows/subscription-overview.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/subscription-overview.test.ts
      - run: npm run typecheck
      - run: npm run build
