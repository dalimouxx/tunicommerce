name: TuniCommerce Call Center agent assignments
on:
  pull_request:
    paths:
      - 'modules/commerce/types.ts'
      - 'modules/commerce/service.ts'
      - 'modules/shops/team-read.ts'
      - 'modules/shops/team-actions.ts'
      - 'modules/shops/call-center-assignment.ts'
      - 'app/api/v1/shops/[shopId]/call-center-assignment/route.ts'
      - 'app/api/v1/shops/[shopId]/team-view/route.ts'
      - 'app/mes-boutiques/[shopId]/shop-agent-assignment.tsx'
      - 'app/mes-boutiques/[shopId]/page.tsx'
      - 'tests/isolated-call-center-assignment.test.ts'
      - '.github/workflows/isolated-call-center-assignment.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/isolated-call-center-assignment.test.ts
      - run: npm run typecheck
      - run: npm run build
