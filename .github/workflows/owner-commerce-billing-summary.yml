name: TuniCommerce owner multi-shop billing overview
on:
  pull_request:
    paths:
      - 'modules/shops/merchant-billing-summary.ts'
      - 'app/mon-abonnement/page.tsx'
      - 'tests/owner-commerce-billing-summary.test.ts'
      - '.github/workflows/owner-commerce-billing-summary.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/owner-commerce-billing-summary.test.ts
      - run: npm run typecheck
      - run: npm run build
