name: TuniCommerce owner carrier handoff receipts
on:
  pull_request:
    paths:
      - 'modules/commerce/types.ts'
      - 'modules/commerce/normalize.ts'
      - 'modules/commerce/service.ts'
      - 'modules/shops/carrier-handoffs.ts'
      - 'app/api/v1/shops/[shopId]/carrier-handoffs/route.ts'
      - 'app/mes-boutiques/[shopId]/shop-carrier-handoffs.tsx'
      - 'app/mes-boutiques/[shopId]/page.tsx'
      - 'tests/isolated-carrier-handoffs.test.ts'
      - '.github/workflows/isolated-carrier-handoffs.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/isolated-carrier-handoffs.test.ts
      - run: npm run typecheck
      - run: npm run build
