name: TuniCommerce P1 actual HTTP multi-tenant isolation
on:
  pull_request:
    paths:
      - 'tests/priority1-http-tenant-boundary.test.ts'
      - 'modules/shops/permissions.ts'
      - 'modules/shops/team-read.ts'
      - 'modules/shops/team-actions.ts'
      - 'modules/shops/aggregate-quotas.ts'
      - 'modules/shops/isolated-commerce.ts'
      - 'modules/shops/public-cod-checkout.ts'
      - 'app/api/v1/shops/**'
      - 'modules/auth/**'
      - 'modules/commerce/**'
      - 'modules/storage/**'
      - 'prisma/schema.prisma'
      - 'prisma/migrations/**'
      - 'scripts/start.mjs'
      - '.github/workflows/priority1-http-tenant-boundary.yml'
  workflow_dispatch:
jobs:
  web-security:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: tunicommerce_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test_user -d tunicommerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/tunicommerce_test?schema=public
      TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/tunicommerce_test?schema=public
      APP_URL: https://p1-tunicommerce-ci.example.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm run build
      - run: node --import tsx --test tests/priority1-http-tenant-boundary.test.ts
