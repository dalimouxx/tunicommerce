name: TuniCommerce P1 shared owner lock and tenant concurrency
on:
  pull_request:
    paths:
      - 'modules/shops/legacy-safe-writes.ts'
      - 'modules/shops/aggregate-quotas.ts'
      - 'app/api/commerce/route.ts'
      - 'tests/priority1-legacy-quota-unit.test.ts'
      - 'tests/priority1-postgres-isolation.test.ts'
      - '.github/workflows/priority1-shared-owner-lock.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: tunicommerce_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d tunicommerce_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://test_user:test_password@localhost:5432/tunicommerce_test?schema=public
      TEST_DATABASE_URL: postgresql://test_user:test_password@localhost:5432/tunicommerce_test?schema=public
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: node --import tsx --test tests/priority1-legacy-quota-unit.test.ts tests/priority1-postgres-isolation.test.ts
      - run: npm run typecheck
      - run: npm run build
