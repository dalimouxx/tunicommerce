name: TuniCommerce isolated shop partial COD
on:
  pull_request:
    paths:
      - 'modules/shops/cod-settlements.ts'
      - 'app/api/v1/shops/[shopId]/cod-settlements/route.ts'
      - 'app/mes-boutiques/[shopId]/shop-cod-settlements.tsx'
      - 'app/mes-boutiques/[shopId]/page.tsx'
      - 'tests/isolated-shop-cod-settlements.test.ts'
      - '.github/workflows/isolated-shop-cod-settlements.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/isolated-shop-cod-settlements.test.ts
      - run: npm run typecheck
      - run: npm run build
