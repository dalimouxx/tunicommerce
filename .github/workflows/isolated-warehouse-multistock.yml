name: TuniCommerce multi depot stock accounting
on:
  pull_request:
    paths:
      - 'modules/commerce/types.ts'
      - 'modules/commerce/normalize.ts'
      - 'modules/commerce/service.ts'
      - 'modules/returns/service.ts'
      - 'modules/warehouse/**'
      - 'modules/shops/warehouse-operations.ts'
      - 'app/api/v1/shops/[shopId]/warehouses/route.ts'
      - 'app/mes-boutiques/[shopId]/shop-warehouses.tsx'
      - 'app/mes-boutiques/[shopId]/page.tsx'
      - 'tests/isolated-multi-depot-stock.test.ts'
      - '.github/workflows/isolated-warehouse-multistock.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/isolated-multi-depot-stock.test.ts tests/wave2-cross-module-regression.test.ts
      - run: npm run typecheck
      - run: npm run build
