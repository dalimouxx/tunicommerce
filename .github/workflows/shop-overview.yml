name: TuniCommerce Shop Overview
on:
  pull_request:
    paths:
      - 'app/mes-boutiques/**'
      - 'modules/shops/commercial-overview.ts'
      - 'tests/commercial-overview.test.ts'
      - '.github/workflows/shop-overview.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/commercial-overview.test.ts
      - run: npm run typecheck
      - run: npm run build
