name: TuniCommerce portal separation
on:
  push:
    branches: ['audit/**']
  pull_request:
    paths:
      - 'app/page.tsx'
      - 'app/admin/**'
      - 'app/marchand/**'
      - 'components/commerce-app.tsx'
      - 'components/admin-panel.tsx'
      - 'tests/portals.test.ts'
      - '.github/workflows/portal-separation.yml'
permissions:
  contents: read
jobs:
  portals:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tunicommerce_portals_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tunicommerce_portals_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tunicommerce_portals_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run db:migrate
      - run: npm run build
      - run: node --import tsx --test tests/portals.test.ts
