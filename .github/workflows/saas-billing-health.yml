name: TuniCommerce global SaaS finance overview
on:
  pull_request:
    paths:
      - 'modules/platform/saas-billing-health.ts'
      - 'app/admin/finances-saas/page.tsx'
      - 'app/admin/layout.tsx'
      - 'tests/saas-billing-health.test.ts'
      - '.github/workflows/saas-billing-health.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/saas-billing-health.test.ts
      - run: npm run typecheck
      - run: npm run build
