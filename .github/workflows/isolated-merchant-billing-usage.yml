name: TuniCommerce merchant subscription usage
on:
  pull_request:
    paths:
      - 'modules/shops/billing-usage.ts'
      - 'app/mes-boutiques/[shopId]/abonnement/page.tsx'
      - 'app/mes-boutiques/[shopId]/page.tsx'
      - 'tests/isolated-merchant-billing-usage.test.ts'
      - '.github/workflows/isolated-merchant-billing-usage.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/isolated-merchant-billing-usage.test.ts
      - run: npm run typecheck
      - run: npm run build
