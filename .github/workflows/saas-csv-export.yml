name: TuniCommerce SaaS CSV Export
on:
  pull_request:
    paths:
      - 'modules/billing/csv-export.ts'
      - 'app/api/admin/subscription-payments/export/**'
      - 'tests/billing-csv-export.test.ts'
      - '.github/workflows/saas-csv-export.yml'
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/billing-csv-export.test.ts
      - run: npm run typecheck
      - run: npm run build
