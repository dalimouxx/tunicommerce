name: TuniCommerce isolated plan-based limits
on:
  pull_request:
    paths:
      - 'modules/shops/plan-growth-policy.ts'
      - 'modules/shops/aggregate-quotas.ts'
      - 'modules/shops/inventory.ts'
      - 'modules/shops/orders.ts'
      - 'modules/shops/public-cod-checkout.ts'
      - 'app/mes-boutiques/[shopId]/shop-inventory.tsx'
      - 'app/mes-boutiques/[shopId]/shop-orders.tsx'
      - 'tests/isolated-shop-orders.test.ts'
      - 'tests/isolated-shop-inventory.test.ts'
      - 'tests/isolated-shop-plan-growth-policy.test.ts'
      - '.github/workflows/isolated-plan-limits.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/isolated-shop-orders.test.ts tests/isolated-shop-inventory.test.ts tests/isolated-shop-plan-growth-policy.test.ts
      - run: npm run typecheck
      - run: npm run build
