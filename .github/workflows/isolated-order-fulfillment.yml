name: TuniCommerce order preparation and private tracking
on:
  pull_request:
    paths:
      - 'modules/shops/order-fulfillment.ts'
      - 'modules/shops/public-cod-checkout.ts'
      - 'app/vitrines/[slug]/public-cart.tsx'
      - 'app/vitrines/[slug]/suivi/[token]/page.tsx'
      - 'app/mes-boutiques/[shopId]/shop-fulfillment.tsx'
      - 'app/mes-boutiques/[shopId]/page.tsx'
      - 'tests/isolated-order-fulfillment.test.ts'
      - '.github/workflows/isolated-order-fulfillment.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/isolated-order-fulfillment.test.ts
      - run: npm run typecheck
      - run: npm run build
