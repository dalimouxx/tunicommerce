name: TuniCommerce P1 encrypted independent offsite backup
on:
  schedule:
    - cron: '43 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tunicommerce-p1-offsite-backup
  cancel-in-progress: false
jobs:
  backup:
    # Enable scheduled writes ONLY after owner configures private storage + secrets.
    if: github.event_name == 'workflow_dispatch' || vars.P1_OFFSITE_BACKUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      P1_BACKUP_DATABASE_URL: ${{ secrets.P1_BACKUP_DATABASE_URL }}
      P1_BACKUP_PASSPHRASE: ${{ secrets.P1_BACKUP_PASSPHRASE }}
      P1_S3_ENDPOINT: ${{ secrets.P1_S3_ENDPOINT }}
      P1_S3_BUCKET: ${{ secrets.P1_S3_BUCKET }}
      P1_S3_REGION: ${{ secrets.P1_S3_REGION }}
      P1_S3_ACCESS_KEY_ID: ${{ secrets.P1_S3_ACCESS_KEY_ID }}
      P1_S3_SECRET_ACCESS_KEY: ${{ secrets.P1_S3_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.P1_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.P1_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.P1_S3_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail closed when private backup configuration is incomplete
        run: node scripts/priority1-backup-config.mjs
      - name: Stream PostgreSQL 18 dump directly into encrypted local file
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          command -v docker >/dev/null
          command -v gpg >/dev/null
          command -v aws >/dev/null
          encrypted="$RUNNER_TEMP/tunicommerce-neon-$GITHUB_RUN_ID.dump.gpg"
          manifest="$RUNNER_TEMP/tunicommerce-neon-$GITHUB_RUN_ID.list"
          trap 'rm -f "$encrypted" "$manifest"' EXIT
          docker run --rm -e P1_BACKUP_DATABASE_URL -e PGCONNECT_TIMEOUT=15 postgres:18 \
            sh -eu -c 'pg_dump --dbname="$P1_BACKUP_DATABASE_URL" --format=custom --no-owner --no-acl --serializable-deferrable' \
            | gpg --batch --yes --quiet --pinentry-mode loopback --passphrase-fd 3 \
              --symmetric --cipher-algo AES256 --s2k-digest-algo SHA512 \
              --output "$encrypted" 3< <(printf '%s' "$P1_BACKUP_PASSPHRASE")
          test -s "$encrypted"
          gpg --batch --quiet --pinentry-mode loopback --passphrase-fd 3 \
            --decrypt "$encrypted" 3< <(printf '%s' "$P1_BACKUP_PASSPHRASE") \
            | docker run --rm -i postgres:18 pg_restore --list > "$manifest"
          grep -q 'TABLE' "$manifest"
          object_key="tunicommerce/neon/$(date -u +%Y/%m/%d)/$(date -u +%Y%m%dT%H%M%SZ)-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.dump.gpg"
          aws --endpoint-url "$P1_S3_ENDPOINT" s3 cp "$encrypted" \
            "s3://$P1_S3_BUCKET/$object_key" --only-show-errors
          uploaded="$(aws --endpoint-url "$P1_S3_ENDPOINT" s3api head-object \
            --bucket "$P1_S3_BUCKET" --key "$object_key" --query ContentLength --output text)"
          test "$uploaded" = "$(stat -c %s "$encrypted")"
          echo "Encrypted backup uploaded and object size verified. Key: $object_key"
      - name: Validate configuration script and regression tests
        run: node --test tests/priority1-backup-config.test.mjs
