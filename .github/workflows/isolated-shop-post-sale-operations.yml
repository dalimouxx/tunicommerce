name: TuniCommerce isolated post-sale operations
on:
  pull_request:
    paths:
      - 'modules/commerce/types.ts'
      - 'modules/commerce/normalize.ts'
      - 'modules/commerce/service.ts'
      - 'modules/shops/isolated-returns.ts'
      - 'modules/shops/carrier-statements.ts'
      - 'app/api/v1/shops/[shopId]/returns/route.ts'
      - 'app/api/v1/shops/[shopId]/carrier-statements/route.ts'
      - 'app/mes-boutiques/[shopId]/shop-returns.tsx'
      - 'app/mes-boutiques/[shopId]/shop-carrier-statements.tsx'
      - 'app/mes-boutiques/[shopId]/shop-callcenter-alerts.tsx'
      - 'app/mes-boutiques/[shopId]/page.tsx'
      - 'tests/isolated-shop-returns.test.ts'
      - 'tests/isolated-carrier-statements.test.ts'
      - '.github/workflows/isolated-shop-post-sale-operations.yml'
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: node --import tsx --test tests/isolated-shop-returns.test.ts tests/isolated-carrier-statements.test.ts
      - run: npm run typecheck
      - run: npm run build
