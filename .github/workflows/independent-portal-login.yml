name: TuniCommerce independent Super Admin and Boutique logins
on:
  pull_request:
    paths:
      - 'modules/auth/session.ts'
      - 'modules/auth/portal.ts'
      - 'modules/auth/service.ts'
      - 'modules/platform/admin.ts'
      - 'app/api/auth/**'
      - 'app/connexion/**'
      - 'app/admin/**'
      - 'app/page.tsx'
      - 'components/auth-form.tsx'
      - 'components/portal-logout.tsx'
      - 'tests/portal-session-isolation.test.ts'
      - 'tests/portal-http-isolation.test.ts'
      - 'tests/admin-control-center.test.ts'
      - 'tests/admin-own-shop.test.ts'
      - '.github/workflows/independent-portal-login.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  auth-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: node --import tsx --test tests/portal-session-isolation.test.ts
      - run: node --test tests/priority1-public-security-smoke.test.mjs
      - run: npm run typecheck
      - run: npm run build
  auth-http:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tunicommerce_portal_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tunicommerce_portal_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tunicommerce_portal_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:migrate
      - run: npm run build
      - run: node --import tsx --test tests/portal-http-isolation.test.ts
