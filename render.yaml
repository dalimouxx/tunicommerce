# Test environment only. Check free-tier availability in the selected workspace.
services:
  - type: web
    name: tunicommerce-test
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tunicommerce-test-db
          property: connectionString
      - key: SETUP_TOKEN
        generateValue: true

databases:
  - name: tunicommerce-test-db
    region: frankfurt
    plan: free
    databaseName: tunicommerce
    postgresMajorVersion: "18"
    ipAllowList: []
